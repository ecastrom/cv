<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.home %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ site.title }}, economist at Tecnológico de Monterrey.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <a class="site-name" href="{{ '/main' | relative_url }}">{{ site.title }}</a>
  <nav>
    <a href="{{ '/research' | relative_url }}"{% if page.title == 'Research' %} aria-current="page"{% endif %}>Research</a>
    <a href="{{ '/teaching' | relative_url }}"{% if page.title == 'Teaching' %} aria-current="page"{% endif %}>Teaching</a>
    <a href="{{ '/cv' | relative_url }}"{% if page.title == 'CV' %} aria-current="page"{% endif %}>CV</a>
  </nav>
</header>

<main>
{% if page.home %}
<div class="intro">
  <img class="portrait" src="{{ '/assets/img/photo.jpg' | relative_url }}" alt="Edgar O. Castro Méndez" width="160" height="240">
  <div>
    <h1>{{ site.title }}</h1>
    <p class="contact">
      School of Social Sciences and Government<br>
      Tecnológico de Monterrey<br>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </p>
  </div>
</div>
{% endif %}
{{ content }}
</main>

<footer class="site-footer">
  {{ site.address }}
</footer>
</body>
</html>
